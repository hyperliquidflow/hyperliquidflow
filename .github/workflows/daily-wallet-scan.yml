name: Daily Wallet Scan

on:
  schedule:
    - cron: '0 0 * * *'   # 00:00 UTC daily
  workflow_dispatch:        # manual trigger for testing

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 50    # hard stop: budget target ~40-45 min, finishes before signal-learning cron at 01:00 UTC

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run daily wallet scan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          KV_REST_API_READ_ONLY_TOKEN: ${{ secrets.KV_REST_API_READ_ONLY_TOKEN }}
          HYPERLIQUID_API_URL: ${{ secrets.HYPERLIQUID_API_URL }}
        run: npx tsx scripts/daily-wallet-scan.ts

      - name: Assert scan produced score history
        run: |
          python3 - <<'EOF'
          import json, sys
          s = json.load(open('scan-summary.json'))
          written = s.get('score_history_written', 0)
          if written == 0:
              sys.exit('score_history_written is 0: silent write failure, see audit 2026-08-08')
          print('score_history_written:', written)
          EOF

      - name: Upload scan summary artifact
        if: always()    # upload even if scan partially failed
        uses: actions/upload-artifact@v4
        with:
          name: scan-summary-${{ github.run_id }}
          path: scan-summary.json
          retention-days: 7
